name: Docker Integration Tests

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/src/**'
      - 'frontend/e2e/**'
      - 'frontend/Dockerfile'
      - 'frontend/nginx.conf'
      - 'docker-compose.yml'
      - 'scripts/test-docker-integration.sh'
      - '.github/workflows/docker-test.yml'

jobs:
  # Workflows always run on PRs so required checks always report; jobs below
  # are skipped (which satisfies the required check) when nothing relevant changed.
  changes:
    name: Detect docker changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docker:
              - 'backend/**'
              - 'frontend/src/**'
              - 'frontend/e2e/**'
              - 'frontend/Dockerfile'
              - 'frontend/nginx.conf'
              - 'docker-compose.yml'
              - 'scripts/test-docker-integration.sh'
              - '.github/workflows/docker-test.yml'

  docker-integration-test:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup Node.js for E2E tests
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run Docker integration tests with E2E
        env:
          RUN_E2E_TESTS: true
        run: ./scripts/test-docker-integration.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7

  docker-custom-hostname-test:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create custom docker-compose override
        run: |
          cat > docker-compose.override.yml <<EOF
          services:
            backend:
              container_name: custom-backend-name
            frontend:
              build:
                args:
                  - BACKEND_HOST=custom-backend-name
              environment:
                - BACKEND_HOST=custom-backend-name
          EOF
          cat docker-compose.override.yml

      - name: Build with custom backend hostname
        run: docker compose build

      - name: Start services with custom hostname
        run: docker compose up -d

      - name: Wait for backend health (internal)
        run: |
          echo "Testing backend with custom container name..."
          for i in {1..60}; do
            if docker compose exec -T backend wget -qO- http://localhost:5000/api/system/health > /dev/null 2>&1; then
              echo "Backend is healthy"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Backend health check timeout"
              docker compose logs backend
              exit 1
            fi
            sleep 1
          done

      - name: Test frontend proxy with custom backend name
        run: |
          echo "Testing proxied health endpoint through nginx..."
          for i in {1..30}; do
            RESPONSE=$(curl -s --max-time 5 http://localhost/api/system/health) && \
              echo "$RESPONSE" | jq -e '.status == "healthy"' > /dev/null 2>&1 && \
              echo "Proxied health response: $RESPONSE" && exit 0
            echo "Attempt $i: proxy not ready yet, retrying..."
            sleep 2
          done
          echo "Frontend proxy health check timeout"
          echo "Last response: $RESPONSE"
          docker compose logs frontend
          exit 1

      - name: Check backend logs on failure
        if: failure()
        run: docker compose logs backend

      - name: Check frontend logs on failure
        if: failure()
        run: docker compose logs frontend

      - name: Cleanup
        if: always()
        run: docker compose down -v
